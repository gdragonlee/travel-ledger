<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>여행 가계부</title>
<meta name="theme-color" content="#2563eb"><meta name="mobile-web-app-capable" content="yes">
<link rel="manifest" href="manifest.webmanifest"><link rel="icon" href="icon.svg" type="image/svg+xml">
<style>body{font-family:system-ui,sans-serif;background:#f6f7fb;color:#18212f;margin:0}.w{max-width:1050px;margin:auto;padding:20px}.c{background:white;padding:18px;border-radius:16px;margin:14px 0;border:1px solid #e5e7eb}.g{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}input,select,button{padding:10px;border-radius:10px;border:1px solid #ddd;font:inherit}input,select{width:100%;box-sizing:border-box}button{cursor:pointer;font-weight:700}.b{background:#2563eb;color:white}.pill{display:inline-block;background:#eef2ff;padding:6px 9px;border-radius:99px;margin:5px}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.s{background:#f8fafc;padding:14px;border-radius:12px}.s b{display:block;font-size:20px}table{width:100%;border-collapse:collapse}td,th{padding:9px;border-bottom:1px solid #eee;text-align:left}.r{text-align:right}.muted{color:#6b7280;font-size:12px}.good{color:#059669}.bad{color:#dc2626}@media(max-width:700px){.g,.stats{grid-template-columns:1fr 1fr}}@media(max-width:450px){.g,.stats{grid-template-columns:1fr}}
.print-only{display:none}
@media print{@page{size:A4;margin:14mm}body{background:#fff;color:#111}.w{max-width:none;padding:0}.no-print{display:none!important}.print-only{display:block!important}.c{box-shadow:none;border:0;padding:8px 0;margin:6px 0}table{font-size:11px}td,th{padding:6px 4px}.stats{grid-template-columns:repeat(4,1fr)}.s{border:1px solid #ddd;background:#fff;padding:8px}.s b{font-size:14px}.muted{font-size:10px}}</style></head>
<body><div class="w"><h1>✈️ 여행 가계부</h1><div class="muted">EUR·KRW 혼합 입력 가능 · 설정 환율로 정산통화 환산 · 개인지출은 정산 제외 · 브라우저 자동 저장</div><p class="no-print"><button id="installBtn" class="b" style="display:none">📲 앱 설치</button></p>
<div class="print-only"><h2 id="printTitle">여행 가계부 정산서</h2><p id="printMeta"></p></div><div class="c no-print"><h3>여행 설정</h3><div class="g"><input id="dest" placeholder="여행지/여행명"><input id="sd" type="date"><input id="ed" type="date"><select id="cur"><option>KRW</option><option>EUR</option><option>USD</option><option>JPY</option></select>
<input id="eurRate" type="number" min="0" step="0.01" placeholder="1 EUR = 원화 (예: 1650)"></div><p><input id="pn" placeholder="여행자 이름" style="max-width:240px"> <button onclick="addP()">여행자 추가</button> <button class="b" onclick="save()">설정 저장</button></p><div id="people"></div></div>
<div class="c no-print"><h3>지출 입력</h3><div class="g"><input id="dt" type="date"><select id="payer"></select><input id="item" placeholder="무엇을 결제했나요?"><select id="method"><option>신용카드</option><option>현금</option><option>체크카드</option><option>Apple/Google Pay</option><option>기타</option></select><input id="amt" type="number" min="0" step=".01" placeholder="금액"><select id="expCur"><option value="EUR">EUR €</option><option value="KRW">KRW ₩</option></select><select id="kind"><option value="shared">공동경비</option><option value="personal">개인지출 (정산 제외)</option></select><input id="memo" placeholder="장소/메모"><button class="b" onclick="addE()">지출 추가</button></div></div>
<div class="c"><div class="stats"><div class="s">전체 지출<b id="all">-</b></div><div class="s">공동경비<b id="shared">-</b></div><div class="s">개인지출<b id="personal">-</b></div><div class="s">1인 부담<b id="share">-</b></div></div></div>
<div class="c"><h3>정산 결과</h3><div id="bal"></div><div id="send"></div></div>
<div class="c"><h3>지출 내역</h3><div style="overflow:auto"><table><thead><tr><th>날짜</th><th>결제자</th><th>항목</th><th>수단</th><th>구분</th><th class="r">금액</th><th></th></tr></thead><tbody id="rows"></tbody></table></div></div>
<div class="c no-print"><button class="b" onclick="savePDF()">PDF로 저장</button> <button onclick="backup()">JSON 백업</button> <button onclick="document.getElementById('imp').click()">백업 불러오기</button> <input hidden id="imp" type="file" accept=".json" onchange="restore(event)"> <button onclick="reset()">전체 초기화</button></div></div>
<script>
const K='trip-ledger-v2';let S=JSON.parse(localStorage.getItem(K)||'null')||{dest:'',sd:'',ed:'',cur:'KRW',eurRate:1650,people:[],exp:[]};const $=x=>document.getElementById(x);
function money(n){return new Intl.NumberFormat('ko-KR',{style:'currency',currency:S.cur,maximumFractionDigits:S.cur==='KRW'?0:2}).format(n||0)}
function persist(){localStorage.setItem(K,JSON.stringify(S));render()}
function save(){S.dest=$('dest').value;S.sd=$('sd').value;S.ed=$('ed').value;S.cur=$('cur').value;S.eurRate=+$('eurRate').value||1650;persist()}
function addP(){let n=$('pn').value.trim();if(n&&!S.people.includes(n)){S.people.push(n);$('pn').value='';persist()}}
function delP(n){if(S.exp.some(e=>e.payer===n))return alert('이 여행자의 지출을 먼저 삭제하세요.');S.people=S.people.filter(x=>x!==n);persist()}
function addE(){let a=+$('amt').value,p=$('payer').value,i=$('item').value.trim();if(!a||!p||!i)return alert('결제자, 항목, 금액을 입력하세요.');S.exp.push({id:Date.now(),date:$('dt').value,payer:p,item:i,method:$('method').value,amount:a,currency:$('expCur').value,kind:$('kind').value,memo:$('memo').value});$('item').value='';$('amt').value='';$('memo').value='';persist()}
function delE(id){S.exp=S.exp.filter(e=>e.id!==id);persist()}
function toBase(e){let c=e.currency||'EUR';if(S.cur==='KRW')return c==='EUR'?e.amount*(S.eurRate||1650):e.amount;if(S.cur==='EUR')return c==='KRW'?e.amount/(S.eurRate||1650):e.amount;return e.amount}
function originalMoney(e){let c=e.currency||'EUR';return new Intl.NumberFormat('ko-KR',{style:'currency',currency:c,maximumFractionDigits:c==='KRW'?0:2}).format(e.amount||0)}
function calc(){let x=S.exp.filter(e=>e.kind==='shared'),t=x.reduce((s,e)=>s+toBase(e),0),q=S.people.length?t/S.people.length:0,paid=Object.fromEntries(S.people.map(p=>[p,0]));x.forEach(e=>paid[e.payer]+=toBase(e));let b=S.people.map(p=>({p,b:paid[p]-q,paid:paid[p]})),d=b.filter(x=>x.b<-.005).map(x=>({p:x.p,a:-x.b})),c=b.filter(x=>x.b>.005).map(x=>({p:x.p,a:x.b})),tr=[];let i=0,j=0;while(i<d.length&&j<c.length){let a=Math.min(d[i].a,c[j].a);tr.push({f:d[i].p,t:c[j].p,a});d[i].a-=a;c[j].a-=a;if(d[i].a<.005)i++;if(c[j].a<.005)j++}return{t,q,b,tr}}
function render(){$('printTitle').textContent=(S.dest||'여행')+' 가계부 정산서';$('printMeta').textContent=(S.sd||'-')+' ~ '+(S.ed||'-')+' · 여행자: '+(S.people.join(', ')||'-')+' · 정산통화: '+S.cur+' · EUR/KRW '+(S.eurRate||1650);$('dest').value=S.dest;$('sd').value=S.sd;$('ed').value=S.ed;$('cur').value=S.cur;$('eurRate').value=S.eurRate||1650;$('people').innerHTML=S.people.map(p=>`<span class="pill">${p} <button onclick='delP(${JSON.stringify(p)})'>×</button></span>`).join('');$('payer').innerHTML=S.people.map(p=>`<option>${p}</option>`).join('');let c=calc(),a=S.exp.reduce((s,e)=>s+toBase(e),0),pe=S.exp.filter(e=>e.kind==='personal').reduce((s,e)=>s+toBase(e),0);$('all').textContent=money(a);$('shared').textContent=money(c.t);$('personal').textContent=money(pe);$('share').textContent=money(c.q);$('bal').innerHTML=c.b.map(x=>`<p><b>${x.p}</b> · 공동 결제 ${money(x.paid)} → <b class="${x.b>=0?'good':'bad'}">${x.b>=0?'받을 돈':'낼 돈'} ${money(Math.abs(x.b))}</b></p>`).join('')||'<span class="muted">여행자를 추가하세요.</span>';$('send').innerHTML=c.tr.length?'<h4>최소 송금</h4>'+c.tr.map(x=>`<p><b>${x.f}</b> → <b>${x.t}</b> : <b>${money(x.a)}</b></p>`).join(''):'';$('rows').innerHTML=[...S.exp].reverse().map(e=>`<tr><td>${e.date}</td><td>${e.payer}</td><td>${e.item}<div class="muted">${e.memo||''}</div></td><td>${e.method}</td><td>${e.kind==='shared'?'공동':'개인'}</td><td class="r">${originalMoney(e)}${(e.currency||'EUR')!==S.cur?`<div class="muted">≈ ${money(toBase(e))}</div>`:''}</td><td><button onclick="delE(${e.id})">삭제</button></td></tr>`).join('')}
function savePDF(){save();$('printTitle').textContent=(S.dest||'여행')+' 가계부 정산서';$('printMeta').textContent=(S.sd||'-')+' ~ '+(S.ed||'-')+' · 여행자: '+(S.people.join(', ')||'-')+' · 정산통화: '+S.cur+' · EUR/KRW '+(S.eurRate||1650);window.print()}
function backup(){let b=new Blob([JSON.stringify(S,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=(S.dest||'trip')+'-ledger.json';a.click()}
function restore(ev){let r=new FileReader();r.onload=()=>{try{S=JSON.parse(r.result);persist()}catch{alert('잘못된 파일입니다.')}};r.readAsText(ev.target.files[0])}
function reset(){if(confirm('모든 데이터를 삭제할까요?')){localStorage.removeItem(K);location.reload()}}
render();$('dt').value=S.sd||new Date().toISOString().slice(0,10);
let deferredPrompt=null;
window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();deferredPrompt=e;document.getElementById('installBtn').style.display='inline-block'});
document.getElementById('installBtn').addEventListener('click',async()=>{if(!deferredPrompt)return;deferredPrompt.prompt();await deferredPrompt.userChoice;deferredPrompt=null;document.getElementById('installBtn').style.display='none'});
if('serviceWorker' in navigator)window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js'));
</script></body></html>
